spring:
  profiles:
    active: ${ENV:dev}

  threads:
    virtual:
      enabled: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: '{baseUrl}/login/oauth2/code/{registrationId}'
            scope:
              - email
              - profile
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL}
    password: ${APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 100MB

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

# Application configuration
app:
  frontendUrl: ${FRONTEND_URL:http://localhost:3000}
  email:
    # brevo (Brevo REST API v3, default) or smtp (Gmail SMTP, EmailService)
    provider: ${EMAIL_PROVIDER:brevo}
  auth:
    tokenSecret: ${TOKEN_SECRET}
    tokenExpirationMs: 259200000 # 3 days
    refresh-token-expiration-ms: 604800000 # 1 week
  oauth2:
    authorizedRedirectUris:
      - http://localhost:3000/oauth2/redirect
      - https://www.tieuphuongcrochet.com/oauth2/redirect
      - https://littlecrochet.web.app/oauth2/redirect
      - https://littlecrochet.firebaseapp.com/oauth2/redirect

# Authorization configuration
authorize:
  http-request:
    allowedOrigins: ${ALLOWED_ORIGINS}

# Firebase configuration
firebase:
  serviceAccountKey: ${SERVICE_ACCOUNT_KEY}

# Brevo configuration (transaction email, REST API v3)
brevo:
  api-key: ${BREVO_API_KEY:}
  base-url: ${BREVO_BASE_URL:https://api.brevo.com/v3}
  sender:
    email: ${BREVO_SENDER_EMAIL:thamphuong.crochet@gmail.com}
    name: ${BREVO_SENDER_NAME:Little Crochet}

# Resilience4j configuration
resilience4j:
  rate-limiter:
    instances:
      passwordResetRateLimiter:
        limitForPeriod: 1
        limitRefreshPeriod: 3m
        timeoutDuration: 5s
      resendEmail:
        limitForPeriod: 3
        limitRefreshPeriod: 1h
        timeoutDuration: 0s
  retry:
    instances:
      resendEmail:
        maxAttempts: 3
        waitDuration: 1s
        retryExceptions:
          - org.springframework.mail.MailException

# PayPal configuration
paypal:
  client-id: ${PAYPAL_CLIENT_ID}
  client-secret: ${PAYPAL_CLIENT_SECRET}
  mode: ${PAYPAL_MODE:sandbox}
