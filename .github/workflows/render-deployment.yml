name: Render deployment

on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'

env:
  ENV: prod
  EMAIL: ${{ secrets.EMAIL }}
  DB_HOST: ${{ secrets.DB_HOST }}
  DB_PORT: ${{ secrets.DB_PORT }}
  DB_NAME: ${{ secrets.DB_NAME }}
  DB_USERNAME: ${{ secrets.DB_USERNAME }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
  APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
  EMAIL_PROVIDER: brevo
  BREVO_SENDER_EMAIL: ${{ secrets.EMAIL }}
  BREVO_SENDER_NAME: Little Crochet
  PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
  PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: little-crochet-prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Gradle build
        run: |
          chmod +x gradlew
          ./gradlew clean build

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    environment: little-crochet-prod
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Install Render CLI
        run: |
          curl --fail --location --silent --show-error https://github.com/render-oss/cli/releases/download/v1.1.0/cli_1.1.0_linux_amd64.zip --output render.zip
          unzip render.zip
          sudo mv cli_v1.1.0 /usr/local/bin/render
      - name: Trigger deploy with Render CLI
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          CI: true
        run: render deploys create "$RENDER_SERVICE_ID" --output json --confirm